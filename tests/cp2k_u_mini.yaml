# Cheap end-to-end CP2K run with UKS + DFT+U + Mulliken, 1 atom.
# Only meant to prove the plumbing (input rendering -> Mulliken parsing ->
# barrier.csv spin column); the physics settings are deliberately sloppy.
project:
  name: ni_u_mini
  workdir: ./runs/ni_u_mini

structure:
  build_initial:
    formula: Ni
    crystal: fcc
    a: 3.52
  build_final:
    formula: Ni
    crystal: fcc
    a: 3.30

calc:
  engine: cp2k
  command: /home/sob/cp2k/install/bin/cp2k.popt
  data_dir: /home/sob/cp2k/data
  env:
    LD_LIBRARY_PATH: "/home/sob/cp2k/install/lib:/opt/intel/oneapi/mkl/2024.0/lib:/opt/intel/oneapi/2024.0/lib:/opt/intel/oneapi/compiler/2024.0/lib:/home/sob/cp2k/tools/toolchain/install/dbcsr-2.10.0/lib:/home/sob/cp2k/tools/toolchain/install/libvori-220621/lib:/home/sob/cp2k/tools/toolchain/install/spglib-2.7.0/lib:/home/sob/cp2k/tools/toolchain/install/plumed-2.10.1/lib:/home/sob/cp2k/tools/toolchain/install/gsl-2.8/lib:/home/sob/cp2k/tools/toolchain/install/elpa-2026.02.002/cpu/lib:/home/sob/cp2k/tools/toolchain/install/libxs-1.0.0/lib:/home/sob/cp2k/tools/toolchain/install/libxsmm-2.0.0/lib:/home/sob/cp2k/tools/toolchain/install/libxc-7.0.0/lib:/home/sob/cp2k/tools/toolchain/install/libint-v2.13.1-cp2k-lmax-5/lib"
  timeout: 900
  kpts: [2, 2, 2]
  params:
    basis_set: {Ni: DZVP-MOLOPT-SR-GTH-q18}
    potential: {Ni: GTH-PBE-q18}
    xc: PBE
    cutoff: 400
    rel_cutoff: 50
    ngrids: 4
    eps_scf: 1.0e-4
    max_scf: 60
    smearing: true
    smearing_method: marzari_vanderbilt
    smearing_sigma: 0.05
    added_mos: 10
    uks: true
    multiplicity: 3
    hubbard_u: {Ni: 4.0}
    hubbard_l: 2
    mulliken: true

neb:
  images: 2
  interpolation: linear
  variable_cell: true
  f_th: 0.30
  max_steps: 2
  dt: 0.1
  max_step: 0.1
  cell_max_step: 0.02
  climbing_image: true
  relax_endpoints: false

output:
  plot: true
