[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vcneb"
version = "0.1.0"
description = "Turnkey variable-cell nudged elastic band for QE, CP2K and ABACUS"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "ase>=3.22",
    "pyyaml>=5.1",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.3"]

[project.scripts]
vcneb = "vcneb.cli:main"

[tool.setuptools.packages.find]
include = ["vcneb*"]
